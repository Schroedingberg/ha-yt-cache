# Production manifest. Remove image locally to build from the Dockerfile.
name: YouTube to Media
version: "0.1.0"
slug: youtube-to-media
description: Download YouTube media to Home Assistant shared storage.
url: "https://github.com/Schroedingberg/ha-yt-cache/tree/main/youtube-to-media"
image: "ghcr.io/schroedingberg/youtube-to-media"
arch:
  - aarch64
  - amd64
init: false
apparmor: false
map:
  - share:rw
webui: "http://[HOST]:[PORT:8099]"
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: YouTube to Media web interface
