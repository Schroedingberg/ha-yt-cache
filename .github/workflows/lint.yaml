name: Lint

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 0 * * *"

jobs:
  find:
    name: Find apps
    runs-on: ubuntu-latest
    outputs:
      addons: ${{ steps.addons.outputs.addons_list }}
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@v7.0.1

      - name: 🔍 Find app directories
        id: addons
        uses: home-assistant/actions/helpers/find-addons@master

  lint:
    name: Lint app ${{ matrix.path }}
    runs-on: ubuntu-latest
    needs: find
    strategy:
      matrix:
        path: ${{ fromJson(needs.find.outputs.addons) }}
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@v7.0.1

      - name: 🚀 Run Home Assistant App Lint
        uses: frenck/action-addon-linter@v2.21
        with:
          path: "./${{ matrix.path }}"

      - name: 🔬 Lint Clojure code with clj-kondo
        uses: docker://cljkondo/clj-kondo:2026.08.04
        with:
          args: --lint "${{ matrix.path }}/src" "${{ matrix.path }}/test"

      - name: 🧪 Run unit tests with Babashka
        env:
          BABASHKA_VERSION: 1.13.225
        run: |
          curl -sSLf -o /tmp/bb.tar.gz "https://github.com/babashka/babashka/releases/download/v${BABASHKA_VERSION}/babashka-${BABASHKA_VERSION}-linux-amd64-static.tar.gz"
          tar -xzf /tmp/bb.tar.gz -C /tmp
          chmod +x /tmp/bb
          cd "${{ matrix.path }}"
          /tmp/bb test
